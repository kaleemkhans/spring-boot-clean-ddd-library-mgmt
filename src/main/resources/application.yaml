spring:
  application:
    name: spring-boot-clean-ddd-library-mgmt
  datasource:
    url: jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
